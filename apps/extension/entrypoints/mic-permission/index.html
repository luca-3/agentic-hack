<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Valo – Allow microphone</title>
    <style>
      :root { color-scheme: light dark; --bg: #f6f7f9; --card: #fff; --text: #17202a; --muted: #5b6673; --accent: #0b6bcb; }
      @media (prefers-color-scheme: dark) { :root { --bg: #111418; --card: #1b2027; --text: #e8edf2; --muted: #9aa6b2; --accent: #5aa9ff; } }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, sans-serif; padding: 16px; box-sizing: border-box; }
      main { max-width: 30rem; background: var(--card); border-radius: 14px; padding: 28px; box-shadow: 0 6px 24px rgb(0 0 0 / 0.08); }
      h1 { font-size: 1.25rem; margin: 0 0 0.5rem; }
      p { margin: 0.5rem 0; color: var(--muted); }
      #status { color: var(--text); font-weight: 600; }
      button { margin-top: 1rem; font: inherit; font-weight: 600; color: #fff; background: var(--accent); border: 0; border-radius: 8px; padding: 0.6rem 1.1rem; cursor: pointer; }
      kbd { font: 0.85em ui-monospace, monospace; border: 1px solid currentColor; border-radius: 4px; padding: 0 0.3em; }
    </style>
  </head>
  <body>
    <main>
      <h1>Valo needs your microphone</h1>
      <p>So you can ask Valo by voice (“Hey Jarvis …” or <kbd data-shortcut="listen">Alt+Shift+L</kbd>). The wake word is detected only on your device; only after that does your question go to speech recognition (Google Gemini).</p>
      <p id="status">Please choose “Allow” in the browser dialog …</p>
      <button id="retry" type="button" hidden>Allow microphone</button>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
