<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Valo – Allow microphone</title>
    <style>
      :root {
        color-scheme: light;
        --shell: #0F2A3D;
        --panel: #FFFFFF;
        --line: #C3D4E0;
        --text: #0F2A3D;
        --muted: #456E8C;
        --primary: #127A86;
        --primary-hover: #0E646E;
        --beacon: #FF8A3D;
        --focus: #7B6AD0;
        font: 15px/1.5 "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--shell);
        color: var(--text);
        padding: 24px;
      }
      main {
        max-width: 30rem;
        width: 100%;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 24px;
        padding: 28px;
      }
      .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
      .brand svg { width: 36px; height: 36px; flex-shrink: 0; }
      .brand span { font-size: 21px; font-weight: 700; letter-spacing: -0.025em; color: var(--text); }
      h1 { font-size: 1.35rem; font-weight: 600; letter-spacing: -0.015em; margin: 0 0 0.5rem; }
      p { margin: 0.6rem 0; color: var(--muted); }
      #status { color: var(--text); font-weight: 600; margin-top: 1rem; }
      button {
        margin-top: 1rem;
        height: 42px;
        padding: 0 20px;
        font: inherit;
        font-weight: 600;
        color: #FFFFFF;
        background: var(--primary);
        border: 1px solid var(--primary);
        border-radius: 999px;
        cursor: pointer;
      }
      button:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
      button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
      kbd {
        font: 600 0.85em "IBM Plex Mono", ui-monospace, monospace;
        border: 1px solid var(--line);
        background: #F2F6F9;
        color: var(--text);
        border-radius: 6px;
        padding: 1px 6px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        <svg viewBox="0 0 40 40" aria-hidden="true">
          <g fill="#FF8A3D"><polygon points="14.5,10.6 2,7 2,8.9"/><polygon points="14.5,12.4 2,16.2 2,14.3"/><polygon points="25.5,10.6 38,7 38,8.9"/><polygon points="25.5,12.4 38,16.2 38,14.3"/><rect x="16.4" y="9" width="7.2" height="5" rx="0.6"/></g>
          <g fill="#0F2A3D"><circle cx="20" cy="4.4" r="1.1"/><path d="M15 9.2 Q20 3.6 25 9.2 Z"/><path d="M15.4 9 h1.4 v5 h-1.4 Z M23.2 9 h1.4 v5 h-1.4 Z"/><rect x="13.8" y="14" width="12.4" height="2.3" rx="0.6"/><path fill-rule="evenodd" d="M15.6 16.3 H24.4 L26.9 32 H13.1 Z M19.1 19.6 h1.8 v3.4 h-1.8 Z M19.1 25.4 h1.8 v3.2 h-1.8 Z"/><path d="M8.5 34 Q11 30 13.6 31.4 L16.4 29.6 L20 31.2 L23.6 29.4 L26.4 31.2 Q29.5 30 31.5 34 Z"/></g>
          <path d="M5 37.2 q2.5 -1.4 5 0 t5 0 t5 0 t5 0 t5 0 t5 0" fill="none" stroke="#0F2A3D" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
        <span>Valo</span>
      </div>
      <h1>Valo needs your microphone</h1>
      <p>So you can ask Valo by voice (“Hey Jarvis …” or <kbd data-shortcut="listen">Alt+Shift+L</kbd>). The wake word is detected locally on your device; only after that does your question go to speech recognition (Google Gemini).</p>
      <p id="status">Please choose “Allow” in the browser dialog …</p>
      <button id="retry" type="button" hidden>Allow microphone</button>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
