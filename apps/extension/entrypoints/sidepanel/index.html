<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lotse</title>
    <style>
      body { margin: 0; padding: 16px; font: 14px/1.5 system-ui, sans-serif; color: #18181b; }
      h1 { margin: 0 0 12px; font-size: 18px; }
      label { display: block; margin-bottom: 6px; font-weight: 500; }
      textarea { box-sizing: border-box; width: 100%; padding: 8px; border: 1px solid #d4d4d8; border-radius: 8px; font: inherit; }
      button { margin-top: 8px; padding: 8px 14px; border: 0; border-radius: 8px; background: #1e3a8a; color: #fff; font: inherit; cursor: pointer; }
      #status { margin-top: 16px; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <h1>Lotse</h1>
    <form id="ask">
      <label for="question">Was möchtest du tun?</label>
      <textarea id="question" rows="3" placeholder="z. B. Wie ändere ich die IBAN?"></textarea>
      <button type="submit">Fragen</button>
    </form>
    <p id="status" role="status"></p>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
