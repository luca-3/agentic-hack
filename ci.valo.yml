schemaVersion: v0.2
# Valo on Codesphere (D-39) — workspace https://691180.1.cloud.codesphere.com hosts only the two Next.js apps:
#   /     dashboard
#   /api  server (/api/lotse/*, /api/knowledge/*)
# Database, auth and vector search run on Supabase Cloud (project jskpfugcnhmcujlsyyhh, eu-central-1);
# migrations are pushed there with the Supabase CLI, not from this pipeline. Steps: docs/hosting-codesphere.md.
# Every service runs in its own container on port 3000. All configuration comes from Codesphere workspace
# variables — nothing secret in this repo (repo is public). Server always NODE_ENV=production, refuses LOTSE_DEV_AUTH.
# Node 24.22.1 via fnm like ci.fuller-dashboard.yml (CVE-2026-111497); new workspace: `fnm install 24.22.1` once.

prepare:
  steps:
    # NEXT_PUBLIC_* are inlined at build time → the workspace variables must be set before this runs.
    - name: Build
      command: fnm exec --using=24.22.1 -- bash -c "npm ci && npm run build -w @lotse/dashboard -w @lotse/server"

test:
  steps:
    - name: Typecheck
      command: fnm exec --using=24.22.1 -- npm run typecheck

run:
  dashboard:
    steps:
      - name: start dashboard
        command: bash infra/codesphere/start-dashboard.sh
    plan: 101
    replicas: 1
    isPublic: true
    network:
      path: /
      stripPath: false
  server:
    steps:
      - name: start server
        command: bash infra/codesphere/start-server.sh
    plan: 101
    replicas: 1
    isPublic: true
    network:
      path: /api
      stripPath: false
